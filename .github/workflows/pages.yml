name: Publier l'atelier S16 sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v6
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Installer les dependances verrouillees
        run: npm ci
      - name: Construire le dossier dist
        run: npm run build
        env:
          ATELIER_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Verifier l'atelier et les ressources
        run: npm run check
      - name: Verifier le dossier commun
        run: node scripts/verifier-dossier-module04.mjs
      - name: Preparer les fichiers publics
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
